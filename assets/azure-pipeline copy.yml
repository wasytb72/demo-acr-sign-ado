trigger:
  branches:
    include:
    - main

pr:
  branches:
    include:
    - main

variables:
  # Azure Container Registry details
  acrServiceConnection: 'acr-service-connection'  # Update with your service connection name
  registryName: '<registry-name>'                 # Update with your ACR name (without .azurecr.io)
  containerRegistry: '$(registryName).azurecr.io'
  imageName: 'web-app-sample'
  imageTag: '$(Build.BuildId)'
  
  # Azure Key Vault details
  keyVaultName: 'your-keyvault-name'              # Update with your Key Vault name
  certificateName: 'container-signing-cert'       # Certificate name in Key Vault
  keyName: '<key-name>'                           # Update with your key name
  certificateKeyId: '<certificate-key-id>'        # Update with your certificate key ID
  azureSubscription: 'azure-service-connection'   # Update with your Azure service connection
  
  # Notation variables
  notationVersion: '1.1.0'
  azureKvPluginVersion: '1.1.0'

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Build
  displayName: 'Build and Sign Container Image'
  jobs:
  - job: BuildAndSign
    displayName: 'Build, Push, and Sign Image'
    steps:
    
    # Checkout code
    - checkout: self
      displayName: 'Checkout Repository'
    
    # Login to Azure
    - task: AzureCLI@2
      displayName: 'Azure Login'
      inputs:
        azureSubscription: '$(azureSubscription)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "Logged in to Azure"
          az account show
    
    # Build and push using ACR build
    - task: AzureCLI@2
      displayName: 'Build Container Image in ACR'
      inputs:
        azureSubscription: '$(azureSubscription)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "Building image in ACR..."
          az acr build \
            --registry $(registryName) \
            --image $(imageName):$(imageTag) \
            --image $(imageName):latest \
            --file Dockerfile \
            .
          
          echo "Image built successfully: $(containerRegistry)/$(imageName):$(imageTag)"
    
    # Setup Notation CLI
    - task: Bash@3
      displayName: 'Setup Notation CLI'
      inputs:
        targetType: 'inline'
        script: |
          echo "Installing Notation CLI v$(notationVersion)..."
          curl -Lo notation.tar.gz https://github.com/notaryproject/notation/releases/download/v$(notationVersion)/notation_$(notationVersion)_linux_amd64.tar.gz
          tar xvzf notation.tar.gz -C /usr/local/bin notation
          chmod +x /usr/local/bin/notation
          notation version
          
          echo "Installing notation-azure-kv plugin v$(azureKvPluginVersion)..."
          curl -Lo notation-azure-kv.tar.gz https://github.com/Azure/notation-azure-kv/releases/download/v$(azureKvPluginVersion)/notation-azure-kv_$(azureKvPluginVersion)_linux_amd64.tar.gz
          mkdir -p ~/.config/notation/plugins/azure-kv
          tar xvzf notation-azure-kv.tar.gz -C ~/.config/notation/plugins/azure-kv
          notation plugin list
    
    # Configure Notation with Key Vault certificate
    - task: AzureCLI@2
      displayName: 'Configure Notation Signing Key'
      inputs:
        azureSubscription: '$(azureSubscription)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        addSpnToEnvironment: true
        inlineScript: |
          echo "Configuring Notation with Key Vault certificate..."
          
          # Get or create certificate
          CERT_ID=$(az keyvault certificate show \
            --vault-name $(keyVaultName) \
            --name $(certificateName) \
            --query 'id' -o tsv 2>/dev/null || echo "")
          
          if [ -z "$CERT_ID" ]; then
            echo "Certificate not found. Creating self-signed certificate..."
            az keyvault certificate create \
              --vault-name $(keyVaultName) \
              --name $(certificateName) \
              --policy @- <<EOF
          {
            "issuerParameters": { "name": "Self" },
            "keyProperties": {
              "exportable": false,
              "keyType": "RSA",
              "keySize": 2048,
              "reuseKey": false
            },
            "secretProperties": { "contentType": "application/x-pkcs12" },
            "x509CertificateProperties": {
              "subject": "CN=Container Signing Certificate",
              "validityInMonths": 12,
              "keyUsage": ["digitalSignature"],
              "ekus": ["1.3.6.1.5.5.7.3.3"]
            }
          }
          EOF
            sleep 10
            CERT_ID=$(az keyvault certificate show \
              --vault-name $(keyVaultName) \
              --name $(certificateName) \
              --query 'id' -o tsv)
          fi
          
          echo "Certificate ID: $CERT_ID"
          
          # Add signing key to Notation
          notation key add \
            --plugin azure-kv \
            --id "$CERT_ID" \
            $(keyName) \
            --plugin-config self_signed=true
          
          notation key list
          notation key list
    
    # Sign container image
    - task: AzureCLI@2
      displayName: 'Sign Container Image'
      inputs:
        azureSubscription: '$(azureSubscription)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        addSpnToEnvironment: true
        inlineScript: |
          IMAGE_REF="$(containerRegistry)/$(imageName):$(imageTag)"
          echo "Signing image: $IMAGE_REF"
          
          # Login to ACR using token authentication
          ACR_NAME=$(echo $(containerRegistry) | cut -d'.' -f1)
          TOKEN=$(az acr login --name $ACR_NAME --expose-token --output tsv --query accessToken)
          echo $TOKEN | notation login $(containerRegistry) --username 00000000-0000-0000-0000-000000000000 --password-stdin
          
          # Sign the image
          notation sign \
            --signature-format cose \
            --key $(keyName) \
            $IMAGE_REF
          
          echo "✓ Image signed successfully!"
          
          # List signatures for verification
          echo "Signatures on image:"
          notation list $IMAGE_REF